id: uwb_realtime_demodulator
label: UWB Realtime Demodulator
category: '[UWB]'

parameters:
-   id: template_path
    label: Preamble template (CF32 file)
    dtype: string
    default: 'reference_preamble.bin'
-   id: num_workers
    label: Num workers
    dtype: int
    default: '2'
-   id: queue_capacity
    label: Queue capacity
    dtype: int
    default: '64'
-   id: sfd_mode
    label: SFD mode (4z2 / decawave / ieee)
    dtype: string
    default: '4z2'
-   id: cir_rake_top_k
    label: CIR RAKE Top-K (used by Auto/RAKE)
    dtype: int
    default: '0'
-   id: cir_filter_mode
    label: CIR soft-chip mode
    dtype: enum
    default: '"bypass"'
    options: ['"auto"', '"full"', '"rake"', '"bypass"']
    option_labels: [Auto (legacy), Full FIR, Top-K RAKE, Bypass FIR (default)]
-   id: code_index
    label: HRP preamble code index (BPRF)
    dtype: enum
    default: '9'
    options: ['9', '10', '11', '12']
    option_labels: [Code 9 (QM35), Code 10, Code 11 (DW1000), Code 12]
-   id: preamble_repetitions
    label: SYNC repetitions
    dtype: int
    default: '64'

inputs:
-   domain: message
    id: samples
    optional: false
-   domain: message
    id: control
    optional: true

outputs:
-   domain: message
    id: result
    optional: true
-   domain: message
    id: status
    optional: true

templates:
    imports: from gnuradio import uwb
    make: uwb.realtime_demodulator(${template_path}, ${num_workers}, ${queue_capacity}, ${sfd_mode}, ${cir_rake_top_k}, ${cir_filter_mode}, ${code_index}, ${preamble_repetitions})

cpp_templates:
    includes: ['#include <gnuradio/uwb/uwb_realtime_demodulator.h>']
    make: 'this->${id} = gr::uwb::UwbRealtimeDemodulator::make(${template_path}, ${num_workers}, ${queue_capacity}, ${sfd_mode}, ${cir_rake_top_k}, ${cir_filter_mode}, ${code_index}, ${preamble_repetitions});'
    link: ['gnuradio::gnuradio-uwb']

file_format: 1
