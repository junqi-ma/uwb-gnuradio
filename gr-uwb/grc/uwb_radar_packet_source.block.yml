id: uwb_radar_packet_source
label: UWB Radar Packet Source
category: '[UWB]'

parameters:
-   id: path
    label: Packet file
    dtype: file_open
    default: ''
-   id: sample_rate
    label: Sample rate
    dtype: real
    default: '998.4e6'
-   id: sample_format
    label: Sample format
    dtype: string
    default: 'fc32'
-   id: sync_repetitions
    label: SYNC repetitions
    dtype: int
    default: '64'
    options: ['32', '64', '128', '256', '512', '1024', '2048']
    option_labels: ['32', '64', '128', '256', '512', '1024', '2048']
-   id: sfd_mode
    label: SFD mode
    dtype: string
    default: '4z2'
-   id: code_index
    label: Code index
    dtype: int
    default: '9'
-   id: pri_s
    label: PRI (s)
    dtype: real
    default: '0.005'
-   id: auto_emit
    label: Auto emit on start
    dtype: bool
    default: 'False'
-   id: descriptor_path
    label: Descriptor JSON
    dtype: file_open
    default: ''

inputs:
-   domain: message
    id: emit
    optional: true

outputs:
-   domain: message
    id: tx
    optional: true
-   domain: message
    id: status
    optional: true

templates:
    imports: from gnuradio import uwb
    make: uwb.radar_packet_source(${path}, ${sample_rate}, ${sample_format}, ${sync_repetitions}, ${sfd_mode}, ${code_index}, ${pri_s}, ${auto_emit}, ${descriptor_path})

cpp_templates:
    includes: ['#include <gnuradio/uwb/uwb_radar_packet_source.h>']
    make: 'this->${id} = gr::uwb::UwbRadarPacketSource::make(${path}, ${sample_rate}, ${sample_format}, ${sync_repetitions}, ${sfd_mode}, ${code_index}, ${pri_s}, ${auto_emit}, ${descriptor_path});'
    link: ['gnuradio::gnuradio-uwb']

documentation: |-
    Load one complete UWB packet file and republish it as a TX PDU.
    Radar loopback example: uwb_radar_loopback_cir.grc.  C++ synthesis is
    uwb_hrp_packet_source / uwb_radar_loopback_cir_synth.grc.

    Message-only (no stream ports).  Does not generate a 5 ms PRI on the
    host; EchoTimer owns device-time scheduling.  emit copies pulse_id
    onto stored IQ (not rebuilt).  auto_emit publishes once from start().

    Native 737.28e6 (UC200) and 491.52e6 (CG400) files require metadata.json
    beside the packet (or an explicit descriptor_path). A format-specific
    metadata.fc32.json or metadata.sc16.json takes precedence. The descriptor
    must bind profile, sample count, sample_format, dtype, byte order and
    interleaved-IQ layout. CG400 sidecars use tx_length_491p52 and
    rate_native_cg400_hz. sc16 is little-endian interleaved int16 IQ.

file_format: 1
