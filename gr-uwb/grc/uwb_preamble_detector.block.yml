id: uwb_preamble_detector
label: UWB Preamble Detector
category: '[UWB]'

parameters:
-   id: template_file
    label: Template file (complex float I/Q)
    dtype: file_open
    default: ''
-   id: threshold
    label: Threshold
    dtype: real
    default: '0.7'

inputs:
-   domain: stream
    dtype: complex

outputs:
-   domain: stream
    dtype: float
    label: metric
-   domain: stream
    dtype: byte
    label: flag

templates:
    imports: from gnuradio import uwb
    make: uwb.preamble_detector.make_from_file(${template_file}, ${threshold})
    callbacks:
    - set_threshold(${threshold})

cpp_templates:
    includes: ['#include <gnuradio/uwb/uwb_preamble_detector.h>']
    make: 'this->${id} = gr::uwb::UwbPreambleDetector::make_from_file(${template_file}, ${threshold});'
    callbacks:
    - set_threshold(${threshold})
    link: ['gnuradio::gnuradio-uwb']

file_format: 1
